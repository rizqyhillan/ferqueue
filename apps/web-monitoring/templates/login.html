<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FERQUEUE — Port Operations Gate</title>
  <link rel="icon" href="/static/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="login-body">

  <!-- Top bar -->
  <header class="login-header">
    <div class="login-header__brand">
      <div class="login-header__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2.5" />
          <line x1="12" y1="7.5" x2="12" y2="21" />
          <path d="M5 13a7 7 0 0 0 14 0" />
          <line x1="8" y1="11" x2="16" y2="11" />
        </svg>
      </div>
      <div class="login-header__text">
        <span class="login-header__title">FERQUEUE</span>
        <span class="login-header__sub">PORT OPERATIONS GATE</span>
      </div>
    </div>
    <div class="login-header__secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Koneksi Aman</span>
    </div>
  </header>

  <!-- Center Card -->
  <main class="login-container">
    <div class="login-card">
      <div class="login-card__icon-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="2.5" />
          <line x1="12" y1="7.5" x2="12" y2="21" />
          <path d="M5 13a7 7 0 0 0 14 0" />
          <line x1="8" y1="11" x2="16" y2="11" />
        </svg>
      </div>

      <h1 class="login-card__title">FERQUEUE</h1>
      <p class="login-card__subtitle">Masuk ke akun operasional Anda</p>

      {% if error %}
      <div class="login-alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form method="POST" action="/login" class="login-form">
        <div class="login-form-group">
          <label class="login-form-label" for="username">Username</label>
          <div class="login-input-wrap">
            <span class="login-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              name="username"
              class="login-input"
              placeholder="operator"
              value="{{ request.form.get('username', 'operator') }}"
              required
            />
          </div>
        </div>

        <div class="login-form-group">
          <div class="login-form-label-row">
            <label class="login-form-label" for="password">Password</label>
            <a href="#" class="login-form-forgot" id="btn-forgot-pw">Lupa Password?</a>
          </div>
          <div class="login-input-wrap">
            <span class="login-input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              class="login-input"
              placeholder="Masukkan password"
              value="operator123"
              required
            />
            <button type="button" class="login-input-toggle" id="btn-toggle-pw" title="Lihat password">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- <div style="margin-bottom: 16px; padding: 10px 12px; background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 8px; font-size: 12px; color: #475569; line-height: 1.5; text-align: left;">
          <div style="font-weight: 600; color: #1e40af; margin-bottom: 2px;">Akun Petugas Terdaftar:</div>
          <div>• Username: <code>operator</code> | Password: <code>operator123</code></div>
          <div>• Username: <code>petugas2</code> | Password: <code>petugas123</code></div>
        </div> -->

        <label class="login-checkbox-wrap">
          <input type="checkbox" name="remember" checked />
          <span>Ingat saya</span>
        </label>

        <button type="submit" class="login-btn-submit">
          <span>Masuk</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="login-copyright">© 2026 PT ASDP Indonesia Ferry (Persero)</p>
  </main>

  <!-- Footer bar -->
  <footer class="login-footer">
    <div class="login-footer-left">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>ISO/IEC 27001 Security Certified</span>
      <span>•</span>
      <span>IMO Port Facility Security Compliant</span>
    </div>
    <div class="login-footer-right">
      <span>Support Desk</span>
      <span>Diagnostics</span>
      <span class="login-footer-badge">v2.2-OPR</span>
    </div>
  </footer>

  <script>
    const btn = document.getElementById('btn-toggle-pw');
    const input = document.getElementById('password');
    const eye = document.getElementById('eye-icon');
    if (btn && input) {
      btn.addEventListener('click', () => {
        const isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        eye.innerHTML = isPw
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });
    }
    const forgotBtn = document.getElementById('btn-forgot-pw');
    if (forgotBtn) {
      forgotBtn.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Akun petugas operasional terdaftar di database MySQL. Anda dapat masuk dengan akun default: operator / operator123.');
      });
    }
  </script>

</body>
</html>
